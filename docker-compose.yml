services:
  snowid-postgres:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PG_MAJOR: 17
    image: snowid-postgres:latest
    container_name: snowid_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: snowid_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - snowid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snowid_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  snowid_pgdata:
