name: Rust Core Library

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true
    
    - name: Run cargo fmt
      run: cargo fmt -- --check
      
    - name: Run cargo clippy
      run: cargo clippy -p snowidv2 -- -D warnings
      
    - name: Run cargo test
      run: cargo test -p snowidv2 --verbose
