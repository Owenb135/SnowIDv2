name: PostgreSQL Extension

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test_extension:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache pgrx
      uses: actions/cache@v3
      with:
        path: ~/.pgrx
        key: ${{ runner.os }}-pgrx
        
    - name: Install PostgreSQL build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          pkg-config \
          libreadline-dev \
          zlib1g-dev \
          flex \
          bison

    - name: Install cargo-pgrx
      run: cargo install --locked cargo-pgrx --version 0.18.0
      
    - name: Initialize pgrx (this takes a while on first run)
      run: cargo pgrx init
      
    - name: Test Postgres Extension (PG 16)
      working-directory: ./snowid_pg
      run: cargo pgrx test pg16 --no-default-features
